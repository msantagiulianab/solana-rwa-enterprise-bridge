spring:
  application:
    name: solana-rwa-enterprise-bridge

  # ------------------------------------------------------------------
  # PostgreSQL via environment variables (see .env.example at repo root).
  # No credentials are ever hardcoded in committed configuration.
  # ------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rwa_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    hibernate:
      # Enterprise default: reject schema drift. Schema is owned exclusively by
      # the versioned Flyway migrations; Hibernate only validates that the
      # entity mappings match the migrated schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # Versioned schema migrations applied on startup before Hibernate validates.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Render's existing PostgreSQL database was previously created by Hibernate
    # auto-DDL and therefore already contains the V1 tables but no
    # flyway_schema_history table. Baseline the pre-existing schema at version 1
    # so Flyway adopts it instead of failing, then applies V2+ onwards.
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}

# ------------------------------------------------------------------
# Solana Devnet RPC configuration, injected via environment variables.
# The private key is loaded strictly at runtime from the environment;
# it must never be committed to source control.
# ------------------------------------------------------------------
solana:
  rpc:
    url: ${SOLANA_DEVNET_RPC_URL:https://api.devnet.solana.com}
    private-key: ${SOLANA_DEVNET_PRIVATE_KEY:}
    priority-fee-baseline-micro-lamports: ${SOLANA_PRIORITY_FEE_BASELINE:1000}
  # Finality confirmation outbox worker. Max attempts is per-record
  # (finality_outbox.max_poll_attempts, column default 30); the values below
  # govern the poll cadence, backoff schedule, and RPC batch size.
  outbox:
    poll-interval-ms: ${SOLANA_OUTBOX_POLL_INTERVAL_MS:5000}
    base-backoff-ms: ${SOLANA_OUTBOX_BASE_BACKOFF_MS:2000}
    max-backoff-ms: ${SOLANA_OUTBOX_MAX_BACKOFF_MS:60000}
    batch-size: ${SOLANA_OUTBOX_BATCH_SIZE:100}

# ------------------------------------------------------------------
# Security – API key gate for mutating routes (POST/PATCH/PUT/DELETE).
# Injected via environment; never committed to source control.
# ------------------------------------------------------------------
security:
  api-key: ${SECURITY_API_KEY:}

# ------------------------------------------------------------------
# Spring Boot Actuator – health & info endpoints for monitoring.
# ------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
