spring:
  application:
    name: solana-rwa-enterprise-bridge

  # ------------------------------------------------------------------
  # PostgreSQL via environment variables (see .env.example at repo root).
  # No credentials are ever hardcoded in committed configuration.
  # ------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rwa_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    hibernate:
      # Enterprise default: reject schema drift. Schema is managed via
      # Flyway/migrations later; do not auto-generate DDL from entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}

# ------------------------------------------------------------------
# Solana Devnet RPC configuration, injected via environment variables.
# The private key is loaded strictly at runtime from the environment;
# it must never be committed to source control.
# ------------------------------------------------------------------
solana:
  rpc:
    url: ${SOLANA_DEVNET_RPC_URL:https://api.devnet.solana.com}
    private-key: ${SOLANA_DEVNET_PRIVATE_KEY:}

# ------------------------------------------------------------------
# Security – API key gate for mutating routes (POST/PATCH/PUT/DELETE).
# Injected via environment; never committed to source control.
# ------------------------------------------------------------------
security:
  api-key: ${SECURITY_API_KEY:}

# ------------------------------------------------------------------
# Spring Boot Actuator – health & info endpoints for monitoring.
# ------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
