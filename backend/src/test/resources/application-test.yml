security:
  api-key: test-api-key

spring:
  datasource:
    url: jdbc:h2:mem:rwa_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Exercise the versioned Flyway migrations against H2 (PostgreSQL mode)
      # instead of auto-generating DDL, so the production schema is what the
      # repository integration tests actually persist against.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
