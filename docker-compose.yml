# Local development infrastructure for the Solana RWA Enterprise Bridge.
# Spins up PostgreSQL for off-chain persistence (compliance, audit, state).
#
# Usage:
#   docker compose up -d            # start PostgreSQL
#   docker compose down -v          # stop and wipe data volume
services:
  postgres:
    image: postgres:16-alpine
    container_name: solana-rwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rwa_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rwa_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
