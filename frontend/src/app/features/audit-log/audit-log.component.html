<div class="p-6">
  <h1 class="text-2xl font-bold text-white mb-6">Audit Log Viewer</h1>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-solana-purple"></div>
    <span class="ml-3 text-gray-400">Loading audit logs...</span>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="bg-red-900/30 border border-red-500/50 rounded-lg p-4 text-red-300 mb-4">
    {{ error }}
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !error && logs.length === 0" class="text-center py-12 text-gray-400">
    <svg class="mx-auto h-12 w-12 mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <p>No audit logs recorded yet. Activity will appear here automatically.</p>
  </div>

  <!-- Logs Table -->
  <div *ngIf="!loading && !error && logs.length > 0" class="overflow-x-auto">
    <table class="w-full text-sm text-left">
      <thead class="text-xs uppercase bg-solana-dark text-gray-400">
        <tr>
          <th class="px-6 py-3">Timestamp</th>
          <th class="px-6 py-3">Event</th>
          <th class="px-6 py-3">Description</th>
          <th class="px-6 py-3">Status</th>
          <th class="px-6 py-3">Tx Hash</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-800">
        <tr *ngFor="let log of logs" class="bg-solana-darker hover:bg-gray-800 transition-colors">
          <td class="px-6 py-4 text-gray-400 whitespace-nowrap">{{ log.timestamp | date:'short' }}</td>
          <td class="px-6 py-4 font-medium text-white">{{ log.eventType }}</td>
          <td class="px-6 py-4 text-gray-300 max-w-xs truncate">{{ log.description }}</td>
          <td class="px-6 py-4">
            <span [class]="statusBadge(log.status)" class="px-2 py-1 rounded border text-xs font-semibold">
              {{ log.status }}
            </span>
          </td>
          <td class="px-6 py-4 font-mono text-xs text-gray-400 max-w-[200px] truncate">
            {{ log.onchainTxHash || 'N/A' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
